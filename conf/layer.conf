# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-opentina"
BBFILE_PATTERN_meta-opentina = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-opentina = "12"

LAYERSERIES_COMPAT_meta-opentina = "scarthgap"
LAYERVERSION_meta-opentina = "1"

LAYERDEPENDS_meta-opentina = "core openembedded-layer"
LAYERRECOMMENDS_meta-opentina = "qt5-layer"

REQUIRED_POKY_BBLAYERS_CONF_VERSION = "2"

# Path to this layer (used by opentina-default-users.bbclass).
OPENTINA_LAYERDIR = "${LAYERDIR}"

# Default login: root:root, opentina:opentina (see conf/include/opentina-default-users.inc)
# and classes/opentina-default-users.bbclass.
