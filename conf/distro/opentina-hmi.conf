require conf/distro/poky.conf
require conf/include/opentina-default-users.inc

DISTRO = "opentina-hmi"
DISTRO_NAME = "OpenTina HMI"
DISTROOVERRIDES = "opentina:opentina-hmi"
TCLIBC = "glibc"

# systemd as init manager (pulls in systemd + usrmerge, replaces sysvinit).
INIT_MANAGER = "systemd"

# Wayland/Weston HMI stack: Mesa opengl/egl + Vulkan (A733 PowerVR via the
# imagination driver, zink for GL), x11 for XWayland, pulseaudio for audio.
DISTRO_FEATURES:append = " opengl egl vulkan wayland x11 pulseaudio pam"

# Accept gstreamer1.0-libav (ffmpeg) commercial license flag for codec support.
LICENSE_FLAGS_ACCEPTED += "commercial"

PREFERRED_VERSION_linux-yocto ?= "6.10%"
PREFERRED_PROVIDER_virtual/kernel:opentina-hmi ?= "linux-dummy"

# A733 PowerVR BXM-4-64 (BVNC 36.56.104.183) needs mesa >= 25.3; wrynose
# ships 26.0.x, so no local mesa recipe is carried any more.
