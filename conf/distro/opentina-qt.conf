# SPDX-License-Identifier: MIT
# OpenTina Qt GUI distribution (glibc, EGL/DRM, Qt5)
#
# Requires meta-qt5 (scarthgap); see scripts/fetch-qt-layers.sh

require conf/distro/poky.conf
require conf/include/opentina-default-users.inc

DISTRO = "opentina-qt"
DISTRO_NAME = "OpenTina Qt"
DISTROOVERRIDES = "opentina:opentina-qt"
TCLIBC = "glibc"

DISTRO_FEATURES:append = " opengl wayland pam systemd"

# Qt5 on embedded targets typically uses eglfs or wayland
DISTRO_FEATURES:append:opentina-qt = " egl"

PREFERRED_VERSION_linux-yocto ?= "6.10%"

# Keep rootfs-only builds working until vendor kernel is integrated
PREFERRED_PROVIDER_virtual/kernel:opentina-qt ?= "linux-dummy"

PACKAGECONFIG:append:pn-qtbase = " eglfs gbm linuxfb"
